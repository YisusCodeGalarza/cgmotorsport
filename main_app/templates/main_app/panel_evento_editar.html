{% extends 'main_app/panel_base.html' %}

{% block title %}Editar Carrera | Panel{% endblock %}

{% block content %}
<div class="mb-8 flex justify-between items-end">
    <div>
        <h1 class="font-display text-3xl font-black text-white uppercase tracking-wide">Editar Carrera</h1>
        <p class="text-gray-400 text-sm mt-1">Modificando registro: <strong class="text-white">{{ evento.titulo }}</strong></p>
    </div>
    <a href="{% url 'panel_eventos' %}" class="text-[#4781B3] hover:text-white text-sm font-bold uppercase tracking-widest"><i class="fas fa-arrow-left mr-2"></i>Volver</a>
</div>

<div class="bg-[#111] border border-white/10 rounded-2xl p-6 md:p-10 max-w-3xl">
    <form method="POST" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">{{ field.label }}</label>
                {{ field }}
            </div>
        {% endfor %}
        <div class="flex gap-4 pt-4 border-t border-white/10">
            <button type="submit" class="bg-[#4781B3] text-white font-bold uppercase tracking-widest text-sm px-8 py-3 rounded-lg hover:bg-white hover:text-black transition-colors">
                Guardar Cambios
            </button>
            <a href="{% url 'panel_eventos' %}" class="bg-white/5 border border-white/10 text-white font-bold uppercase tracking-widest text-sm px-8 py-3 rounded-lg hover:bg-white/10 transition-colors">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
