{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CG Motorsports | Off-Road Team{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Urbanist', sans-serif; background-color: #0b0f1a; color: #ffffff; }
        .text-cg-blue { color: #5bb3e5; }
        .border-cg-blue { border-color: #5bb3e5; }
        .bg-cg-blue { background-color: #5bb3e5; }
        .hero-overlay { background: linear-gradient(0deg, rgba(11,15,26,1) 0%, rgba(11,15,26,0.3) 100%); }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="antialiased">

    <nav class="fixed w-full z-50 bg-black/90 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                
                <div class="flex items-center gap-3">
                    <img src="{% static 'main_app/images/logo.png' %}" class="h-14 w-auto object-contain" alt="CG Motorsports Logo">
                    <span class="text-xl font-black tracking-tighter italic hidden sm:block">CG <span class="text-cg-blue">MOTORSPORTS</span></span>
                </div>

                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-8 font-bold uppercase text-sm tracking-widest">
                        <a href="/" class="hover:text-cg-blue transition">Inicio</a>
                        <a href="#eventos" class="hover:text-cg-blue transition">Calendario</a>
                        <a href="#galeria" class="hover:text-cg-blue transition">Galería</a>
                        <a href="#patrocinadores" class="hover:text-cg-blue transition">Sponsors</a>
                        <a href="/admin" class="bg-cg-blue text-black px-4 py-2 rounded-sm font-bold hover:bg-white transition">Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="h-20"></div>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-black py-8 border-t border-white/5 text-center text-gray-500 text-sm tracking-widest uppercase">
        © 2026 CG Motorsports Team.
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
